name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Before proposing a change to the core pipeline, it's worth skimming
        [ingest-pipeline.md §10](https://github.com/kunal-arora-1411/Debuginator/blob/main/docs/architecture/ingest-pipeline.md),
        which lists what is deliberately not built yet and why.
  - type: dropdown
    id: package
    attributes:
      label: Which part of BugBuster?
      multiple: true
      options:
        - SDK (@bugbusterhq/sdk-node)
        - Agent (@bugbusterhq/agent)
        - Backend (@bugbusterhq/backend)
        - Dashboard
        - Types
        - Docs
        - New package / integration
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this.
